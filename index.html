<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Harsha ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  background: pink;
  overflow:hidden;
  font-family: "Comic Sans MS", cursive;
}
.screen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.hidden {display:none;}
button {
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:20px;
  background:#ff4081;
  color:white;
}
#gift {font-size:120px; animation: float 2s infinite alternate;}
@keyframes float {from{transform:translateY(0)} to{transform:translateY(-20px)}}
.heart {
  position:absolute;
  color:red;
  font-size:20px;
  animation: fall 6s linear infinite;
}
@keyframes fall {
  from{top:-10%;}
  to{top:110%;}
}
.message {
  font-size:22px;
  text-align:center;
  animation: fade 2s;
}
@keyframes fade {from{opacity:0;} to{opacity:1;}}
#cake {font-size:120px;}
</style>
</head>
<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="screen1" class="screen">
  <div id="gift">🎁</div>
  <button onclick="openGift()">Open Gift</button>
</div>

<div id="screen2" class="screen hidden">
  <div id="cake">🎂</div>
  <button onclick="blow()">Blow Candles</button>
</div>

<div id="screen3" class="screen hidden">
  <div id="msg" class="message"></div>
  <button id="nextBtn" onclick="nextMsg()">Next</button>
</div>

<div id="screen4" class="screen hidden" style="background:black;color:white;">
  <div class="message">I LOVE YOU SO MUCHHH<br>MY PRINCESS 👑❤️</div>
</div>

<script>
const messages = [
"🎉 Happy Birthday Harsha 🎂❤️",
"Aaj No Divas Bau J Khaas Chhe 💖",
"Mane Tara Thi Kai Kahvu Chhe…!!",
"Jyaar Thi Tu Mari Life Ma Aavi…",
"Sachu kahu toh…, Hu Thodo Fattuuu Chu 😏😂",
"Pan Tari Mate Kai Pan Kari Saku Chu ❤️",
"Tu Mari Duniya Chhe 🌍",
"Hu Bas Etlu J Icchu Chu Ke Tu Hamesha Khush Reh",
"Tu Maru Jiv Chhe Ane Mane Mara Jiv Karta Tu Jiv Sauthi Vadhaare Vhaalu Chhe 💖",
"– Taro Fattuuu"
];let i=0;

function openGift(){
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");
  document.getElementById("music").play();
}
function blow(){
  document.getElementById("screen2").classList.add("hidden");
  document.getElementById("screen3").classList.remove("hidden");
  showMsg();
}
function showMsg(){
  document.getElementById("msg").innerText = messages[i];
}
function nextMsg(){
  i++;
  if(i<messages.length){
    showMsg();
  } else {
    document.getElementById("screen3").classList.add("hidden");
    document.getElementById("screen4").classList.remove("hidden");
  }
}
function createHeart(){
  let h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"%";
  h.style.fontSize=(15+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(createHeart,500);
</script>

</body>
</html>
