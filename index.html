<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:linear-gradient(to bottom, #ff9a9e, #fad0c4);
  font-family:Arial, sans-serif;
  text-align:center;
}

/* HEARTS */
.heart{
  position:absolute;
  color:pink;
  font-size:20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh); opacity:1;}
  100%{transform:translateY(-10vh); opacity:0;}
}

/* TEXT */
#message{
  position:absolute;
  bottom:20%;
  width:100%;
  font-size:32px;
  color:white;
  text-shadow:2px 2px 5px black;
  animation:fade 2s ease-in-out;
}

@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

/* BUTTON */
button{
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:20px;
  background:#ff3366;
  color:white;
  cursor:pointer;
}

/* FINAL SCREEN */
#final{
  display:none;
  background:black;
  color:white;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" src="music.mp3" autoplay loop></audio>

<div id="message">🎂 Happy Birthday My Love ❤️</div>

<br><br><br><br><br><br>

<button onclick="nextMsg()">Next 💌</button>

<div id="final">
  <h1 style="margin-top:40vh;">I LOVE YOU SO MUCH ❤️</h1>
  <button onclick="closeCard()">Exit</button>
</div>

<script>
let msgs = [
 "You are my happiness 💖",
 "You are my life 🌸",
 "Stay with me forever 💕",
 "I Love You My Princess 👑"
];

let i = 0;

function nextMsg(){
  i++;
  if(i < msgs.length){
    document.getElementById("message").innerText = msgs[i];
  }else{
    document.getElementById("final").style.display="block";
  }
}

/* HEART GENERATOR */
setInterval(()=>{
  let h = document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(20+Math.random()*30)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);

function closeCard(){
  document.body.innerHTML="<h1 style='color:white;margin-top:40vh;'>Bye ❤️</h1>";
}
</script>

</body>
</html>
