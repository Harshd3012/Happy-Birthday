<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Harsha ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background: pink;
  overflow:hidden;
  font-family: 'Poppins', sans-serif;
}

/* Screens */
.screen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.hidden {display:none;}

/* Button */
button {
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:25px;
  background: linear-gradient(45deg, #ff4081, #ff80ab);
  color:white;
  font-family: 'Poppins', sans-serif;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  cursor:pointer;
}

/* Gift Animation */
#gift {
  font-size:120px;
  animation: float 2s infinite alternate;
}
@keyframes float {
  from{transform:translateY(0)}
  to{transform:translateY(-20px)}
}

/* Hearts */
.heart {
  position:absolute;
  color:red;
  animation: fall 6s linear infinite;
}
@keyframes fall {
  from{top:-10%;}
  to{top:110%;}
}

/* Message */
.message {
  font-size:24px;
  text-align:center;
  animation: fade 1.5s;
  font-family: 'Pacifico', cursive;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
}

/* Fade */
@keyframes fade {
  from{opacity:0;}
  to{opacity:1;}
}

/* Cake */
#cake {
  font-size:120px;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Screen 1 -->
<div id="screen1" class="screen">
  <div id="gift">🎁</div>
  <button onclick="openGift()">Open Gift</button>
</div>

<!-- Screen 2 -->
<div id="screen2" class="screen hidden">
  <div id="cake">🎂</div>
  <button onclick="blow()">Blow Candles</button>
</div>

<!-- Screen 3 -->
<div id="screen3" class="screen hidden">
  <div id="msg" class="message"></div>
  <button onclick="nextMsg()">Next</button>
</div>

<!-- Screen 4 -->
<div id="screen4" class="screen hidden" style="background:black;color:white;">
  <div class="message">I AM VERY LUCKY TO HAVE YOU<br>MY PRINCESS 👑❤️</div>
</div>

<script>
const messages = [
"🎉 Happy Birthday Harsha 🎂❤️",
"Aaj No Divas Bau J Khaas Chhe 💖",
"Mane Tara Thi Kai Kahvu Chhe…!!",
"Jyaar Thi Tu Mari Life Ma Aavi…",
"Sachu kahu toh…, Hu Thodo Fattuuu Chu 😏😂",
"Pan Tari Mate Kai Pan Kari Saku Chu ❤️",
"Tu Mari Duniya Chhe 🌍",
"Hu Bas Etlu J Icchu Chu Ke Tu Hamesha Khush Reh",
"Tu Maru Jiv Chhe Ane Mane Mara Jiv Karta Tu Jiv Sauthi Vadhaare Vhaalu Chhe 💖",
"– Taro Fattuuu"
];

let i = 0;

function openGift(){
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");

  let music = document.getElementById("music");
  music.play().catch(() => {});
}

function blow(){
  document.getElementById("screen2").classList.add("hidden");
  document.getElementById("screen3").classList.remove("hidden");
  showMsg();
}

function showMsg(){
  document.getElementById("msg").innerText = messages[i];
}

function nextMsg(){
  i++;
  if(i < messages.length){
    showMsg();
  } else {
    document.getElementById("screen3").classList.add("hidden");
    document.getElementById("screen4").classList.remove("hidden");
  }
}

function createHeart(){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerText = "❤️";
  h.style.left = Math.random()*100 + "%";
  h.style.fontSize = (15 + Math.random()*20) + "px";
  document.body.appendChild(h);

  setTimeout(() => h.remove(), 6000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
