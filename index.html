<html lang="en">
<head>

```
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        overflow: hidden;
        font-family: "Montserrat", sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fecfef);
    }

    .screen {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 55px;

        z-index: 5;
    }

    .hidden {
        display: none !important;
    }

    /* =========================
       BUTTON
    ========================= */

    .main-button {
        padding: 14px 32px;

        border: 0;
        border-radius: 50px;

        background: #000;
        color: #fff;

        font-family: "Montserrat", sans-serif;
        font-size: 16px;
        font-weight: 500;

        letter-spacing: 1px;

        cursor: pointer;

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;
    }

    .main-button:hover {
        transform: scale(1.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .main-button:active {
        transform: scale(0.96);
    }

    /* =========================
       GIFT
    ========================= */

    #gift {
        font-size: 110px;
        animation: giftFloat 2s ease-in-out infinite alternate;
    }

    @keyframes giftFloat {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-20px);
        }
    }

    /* =========================
       CAKE
    ========================= */

    #cake {
        font-size: 110px;
        animation: cakeFloat 2s ease-in-out infinite alternate;
    }

    @keyframes cakeFloat {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-15px);
        }
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
        width: 100%;
        max-width: 950px;

        padding: 0 25px;

        text-align: center;

        font-family: "Playfair Display", serif;
        font-size: 28px;
        line-height: 1.55;

        color: #111;

        animation: messageIn 1s ease;
    }

    @keyframes messageIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================
       FINAL SCREEN
    ========================= */

    #screen4 {
        background: #000;
    }

    #screen4 .message {
        color: #fff;
    }

    /* =========================
       HEARTS
    ========================= */

    .heart {
        position: fixed;

        top: -60px;

        z-index: 1;

        pointer-events: none;

        opacity: 0.65;

        animation-name: heartFall;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
    }

    @keyframes heartFall {
        from {
            transform: translateY(0) rotate(0deg);
        }

        to {
            transform: translateY(115vh) rotate(360deg);
        }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .screen {
            gap: 45px;
        }

        #gift,
        #cake {
            font-size: 85px;
        }

        .message {
            font-size: 21px;
            line-height: 1.55;
            padding: 0 20px;
        }

        .main-button {
            padding: 13px 26px;
            font-size: 14px;
        }
    }
</style>

<body>

```
<!-- =========================

<audio id="music" loop preload="auto">

<!-- =========================

<section id="screen1" class="screen">

    <button
        id="openButton"

    >
        OPEN
    </button>

</section>


<!-- =========================
     SCREEN 2
========================= -->

<section id="screen2" class="screen hidden">

    <div id="cake">🎂</div>

    <button
        id="messageButton"
        class="main-button"
        type="button"
    >
        GET A MESSAGE..
    </button>

</section>


<!-- =========================
     SCREEN 3
========================= -->

<section id="screen3" class="screen hidden">

    <div
        id="msg"
        class="message"
    ></div>

    <button
        id="nextButton"
        class="main-button"
        type="button"
    >
        NEXT
    </button>

</section>


<!-- =========================
     SCREEN 4
========================= -->

<section
    id="screen4"
    class="screen hidden"
>

    <div class="message">

        I AM VERY LUCKY TO HAVE A FRIEND LIKE YOU ❤️

        <br><br>

        MISS MITALI KOSHTI 👑

    </div>

</section>


<script>

    /* ==========================================
       GET HTML ELEMENTS
    ========================================== */

    const screen1 = document.getElementById("screen1");
    const screen2 = document.getElementById("screen2");
    const screen3 = document.getElementById("screen3");
    const screen4 = document.getElementById("screen4");

    const openButton = document.getElementById("openButton");
    const messageButton = document.getElementById("messageButton");
    const nextButton = document.getElementById("nextButton");

    const messageBox = document.getElementById("msg");
    const music = document.getElementById("music");


    /* ==========================================
       BIRTHDAY MESSAGES
    ========================================== */

    const messages = [
        "Happy Birthday Mituuuu...!! ❤️",

        "May Dwarkadhish Bless You 💖",

        "Just Be Stay Happy It Suits You......",

        "Sometimes I Don't Say It, But You Truly Mean A Lot To Me... ❤️",

        "Tu Mara Jivan No Ek Best Part Rahi Chhe…..",

        "Ha I Know Ghani Vakhat Aapdu Ladvaaanu Ke Gusse Thavaanu Thatu Hoy Chhe... 😅",

        "But Still.... You're Best Female Friend I Ever Met..!! ❤️",

        "Taru Hasvu, Taru E Chidavvu, Taru E Sarcasm Ma Taunt Maarvo Badha Ma Ek Alag J Vibe Aave Chhe... 🌍",

        "Tu Bhale Kya Pan Rahe Hamesha Khush Reh Bas Etlu J Icchu Chu 💕",

        "Many Many Happy Returns Of The Day ❤️",

        "Bas Aatlu J Kehvu Chhe Ke Tu Jevi Chhe Ne, Evi J Rehje... Koi Change Ni Jarur Nathi... 🫶",

        "Aapdi Aa Bakchodi, Ladai Ane Random Conversations Aavi J Rite Chalta Rehva Joiye... 😂❤️",

        "Ane Ha... Aapdi Aa Friendship Aavi J Mast, Crazy Ane Thodi Pagal Rehvi Joiye Hamesha... 😂❤️",

        "Have A Superb Day......",

        "– Aapka Subh Chintak"
    ];


    /* ==========================================
       MESSAGE COUNTER
    ========================================== */

    let currentMessage = 0;


    /* ==========================================
       OPEN BUTTON
    ========================================== */

    openButton.addEventListener("click", function () {

        screen1.classList.add("hidden");

        screen2.classList.remove("hidden");

        music.play().catch(function () {
            console.log("Music needs user interaction.");
        });

    });


    /* ==========================================
       GET MESSAGE BUTTON
    ========================================== */

    messageButton.addEventListener("click", function () {

        screen2.classList.add("hidden");

        screen3.classList.remove("hidden");

        currentMessage = 0;

        displayMessage();

    });


    /* ==========================================
       DISPLAY MESSAGE
    ========================================== */

    function displayMessage() {

        messageBox.style.animation = "none";

        void messageBox.offsetWidth;

        messageBox.innerText =
            messages[currentMessage];

        messageBox.style.animation =
            "messageIn 1s ease";

    }


    /* ==========================================
       NEXT BUTTON
    ========================================== */

    nextButton.addEventListener("click", function () {

        currentMessage++;

        if (currentMessage < messages.length) {

            displayMessage();

        } else {

            screen3.classList.add("hidden");

            screen4.classList.remove("hidden");

        }

    });


    /* ==========================================
       FALLING HEARTS
    ========================================== */

    function createHeart() {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.innerText = "❤️";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (4 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(function () {

            heart.remove();

        }, 9000);
    }


    /* ==========================================
       CREATE HEART EVERY HALF SECOND
    ========================================== */

    setInterval(createHeart, 500);

</script>
