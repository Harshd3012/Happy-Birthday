<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For Mitali ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Premium Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;500&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            font-family: 'Montserrat', sans-serif;
        }

        /* =========================
           COMMON SCREEN
        ========================= */

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 60px;

            z-index: 2;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            padding: 14px 30px;

            font-size: 16px;
            font-weight: 500;

            border: none;
            border-radius: 30px;

            background: #000;
            color: #fff;

            font-family: 'Montserrat', sans-serif;

            letter-spacing: 1px;

            cursor: pointer;

            transition: all 0.3s ease;

            position: relative;
            z-index: 10;
        }

        button:hover {
            transform: scale(1.08);
        }

        button:active {
            transform: scale(0.95);
        }

        /* =========================
           GIFT
        ========================= */

        #gift {
            font-size: 110px;

            animation: float 2s ease-in-out infinite alternate;
        }

        @keyframes float {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-20px);
            }
        }

        /* =========================
           CAKE
        ========================= */

        #cake {
            font-size: 110px;

            animation: cakeFloat 2s ease-in-out infinite alternate;
        }

        @keyframes cakeFloat {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-12px);
            }
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            max-width: 900px;

            padding: 0 25px;

            text-align: center;

            font-family: 'Playfair Display', serif;

            font-size: 28px;

            line-height: 1.5;

            color: #111;

            position: relative;

            z-index: 5;

            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           FINAL SCREEN
        ========================= */

        #screen4 {
            background: #000;
            color: #fff;
        }

        #screen4 .message {
            color: #fff;
        }

        /* =========================
           HEARTS
        ========================= */

        .heart {
            position: absolute;

            top: -50px;

            color: red;

            opacity: 0.6;

            z-index: 1;

            pointer-events: none;

            animation: fall linear forwards;

            filter: blur(0.5px);
        }

        @keyframes fall {
            from {
                transform: translateY(0) rotate(0deg);
            }

            to {
                transform: translateY(120vh) rotate(360deg);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .message {
                font-size: 22px;
                line-height: 1.5;
                padding: 0 20px;
            }

            #gift,
            #cake {
                font-size: 90px;
            }

            button {
                padding: 13px 25px;
                font-size: 15px;
            }

            .screen {
                gap: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         MUSIC
    ========================= -->

    <audio id="music" loop>
        <source src="music.mp3?v=2" type="audio/mpeg">
    </audio>


    <!-- =========================
         SCREEN 1
    ========================= -->

    <div id="screen1" class="screen">

        <div id="gift">
            🎁
        </div>

        <button onclick="openGift()">
            OPEN
        </button>

    </div>


    <!-- =========================
         SCREEN 2
    ========================= -->

    <div id="screen2" class="screen hidden">

        <div id="cake">
            🎂
        </div>

        <button onclick="showMessages()">
            GET A MESSAGE..
        </button>

    </div>


    <!-- =========================
         SCREEN 3
    ========================= -->

    <div id="screen3" class="screen hidden">

        <div id="msg" class="message"></div>

        <button onclick="nextMsg()">
            NEXT
        </button>

    </div>


    <!-- =========================
         SCREEN 4
    ========================= -->

    <div id="screen4" class="screen hidden">

        <div class="message">

            I AM VERY LUCKY TO HAVE A FRIEND LIKE YOU ❤️

            <br><br>

            MISS MITALI KOSHTI 👑

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           BIRTHDAY MESSAGES
        ========================= */

        const messages = [

            "Happy Birthday Mituuuu...!! ❤️",

            "May Dwarkadhish Bless You 💖",

            "Just Be Stay Happy It Suits You......",

            "Sometimes I Don't Say It, But You Truly Mean A Lot To Me... ❤️",

            "Tu Mara Jivan No Ek Best Part Rahi Chhe…..",

            "Ha I Know Ghani Vakhat Aapdu Ladvaaanu Ke Gusse Thavaanu Thatu Hoy Chhe... 😅",

            "But Still.... You're Best Female Friend I Ever Met..!! ❤️",

            "Taru Hasvu, Taru E Chidavvu, Taru E Sarcasm Ma Taunt Maarvo Badha Ma Ek Alag J Vibe Aave Chhe... 🌍",

            "Tu Bhale Kya Pan Rahe Hamesha Khush Reh Bas Etlu J Icchu Chu 💕",

            "Many Many Happy Returns Of The Day ❤️",

            "Bas Aatlu J Kehvu Chhe Ke Tu Jevi Chhe Ne, Evi J Rehje... Koi Change Ni Jarur Nathi... 🫶",

            "Aapdi Aa Bakchodi, Ladai Ane Random Conversations Aavi J Rite Chalta Rehva Joiye... 😂❤️",

            "Ane Ha... Aapdi Aa Friendship Aavi J Mast, Crazy Ane Thodi Pagal Rehvi Joiye Hamesha... 😂❤️",

            "Have A Superb Day......",

            "– Aapka Subh Chintak"

        ];


        /* =========================
           MESSAGE COUNTER
        ========================= */

        let currentMessage = 0;


        /* =========================
           OPEN GIFT
        ========================= */

        function openGift() {

            document
                .getElementById("screen1")
                .classList
                .add("hidden");


            document
                .getElementById("screen2")
                .classList
                .remove("hidden");


            /* Start Music */

            const music = document.getElementById("music");

            music.play().catch(function(error) {

                console.log("Music playback blocked:", error);

            });

        }


        /* =========================
           SHOW FIRST MESSAGE
        ========================= */

        function showMessages() {

            document
                .getElementById("screen2")
                .classList
                .add("hidden");


            document
                .getElementById("screen3")
                .classList
                .remove("hidden");


            currentMessage = 0;

            showMessage();

        }


        /* =========================
           DISPLAY MESSAGE
        ========================= */

        function showMessage() {

            const messageBox =
                document.getElementById("msg");


            messageBox.style.animation = "none";


            void messageBox.offsetWidth;


            messageBox.style.animation =
                "fadeIn 1.2s ease";


            messageBox.innerText =
                messages[currentMessage];

        }


        /* =========================
           NEXT MESSAGE
        ========================= */

        function nextMsg() {

            currentMessage++;


            if (currentMessage < messages.length) {

                showMessage();

            } else {

                document
                    .getElementById("screen3")
                    .classList
                    .add("hidden");


                document
                    .getElementById("screen4")
                    .classList
                    .remove("hidden");

            }

        }


        /* =========================
           CREATE FALLING HEART
        ========================= */

        function createHeart() {

            const heart =
                document.createElement("div");


            heart.className = "heart";


            heart.innerText = "❤️";


            heart.style.left =
                Math.random() * 100 + "%";


            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";


            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";


            document.body.appendChild(heart);


            setTimeout(function() {

                heart.remove();

            }, 8000);

        }


        /* =========================
           HEART GENERATOR
        ========================= */

        setInterval(createHeart, 500);

    </script>

</body>
</html>
