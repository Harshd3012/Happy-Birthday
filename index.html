<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Mitali ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  overflow:hidden;
  font-family: 'Montserrat', sans-serif;
}

/* Screens */
.screen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap: 60px; /* 🔥 button niche */
  z-index: 1;
}

.hidden {display:none;}

/* Button */
button {
  padding:14px 28px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background:#000;
  color:white;
  font-family:'Montserrat', sans-serif;
  letter-spacing:1px;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  transform:scale(1.05);
}

/* Gift */
#gift {
  font-size:110px;
  animation: float 2s infinite alternate;
}

@keyframes float {
  from{transform:translateY(0)}
  to{transform:translateY(-20px)}
}

/* Hearts (BACKGROUND) */
.heart {
  position:absolute;
  color:red;
  animation: fall 6s linear infinite;
  z-index: 0;
  opacity: 0.6;
  filter: blur(1px);
}

@keyframes fall {
  from{top:-10%;}
  to{top:110%;}
}

/* Message */
.message {
  font-size:26px;
  text-align:center;
  animation: fade 1.5s;
  font-family: 'Playfair Display', serif;
  padding: 0 20px;
  position: relative;
  z-index: 2;
}

@keyframes fade {
  from{opacity:0;}
  to{opacity:1;}
}

/* Cake */
#cake {
  font-size:110px;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Screen 1 -->
<div id="screen1" class="screen">
  <div id="gift">🎁</div>
  <button onclick="openGift()">OPEN</button>
</div>

<!-- Screen 2 -->
<div id="screen2" class="screen hidden">
  <div id="cake">🎂</div>
  <button onclick="blow()">GET A MASSAGE..</button>
</div>

<!-- Screen 3 -->
<div id="screen3" class="screen hidden">
  <div id="msg" class="message"></div>
  <button onclick="nextMsg()">NEXT</button>
</div>

<!-- Screen 4 -->
<div id="screen4" class="screen hidden" style="background:black;color:white;">
  <div class="message">I AM VERY LUCKY TO HAVE A FRIEND LIKE YOU ❤️<br>MISS MITALI KOSHTI 👑</div>
</div>

<script>
const messages = [
"Happy Birthday Mituuuu...!! ❤️",
"May Dwarkadhish Bless You 💖",
"Just Be Stay Happy It Suits You......",
"Tu Mara Jivan No Ek Best Part Rahi Chhe…..",
"Ha I Know Ghani Vakhat Aapdu Ladvaaanu Ke Gusse Thavaanu Thatu Hoy Chhe... 😅",
"But Still.... You're Best Female Friend I Ever Met..!! ❤️",
"Taru Hasvu, Taru E Chidavvu, Taru E Sarcasm Ma Taunt Maarvo Badha Ma Ek Alag J Vibe Aave Chhe... 🌍",
"Tu Bhale Kya Pan Rahe Hamesha Khush Reh Bas Etlu J Icchu Chu 💕",
"Many Many Happy Returns Of The Day ❤️",
"– Aapka Subh Chintak"
];

let i = 0;

function openGift(){
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");
  document.getElementById("music").play().catch(()=>{});
}

function blow(){
  document.getElementById("screen2").classList.add("hidden");
  document.getElementById("screen3").classList.remove("hidden");
  showMsg();
}

function showMsg(){
  document.getElementById("msg").innerText = messages[i];
}

function nextMsg(){
  i++;
  if(i < messages.length){
    showMsg();
  } else {
    document.getElementById("screen3").classList.add("hidden");
    document.getElementById("screen4").classList.remove("hidden");
  }
}

function createHeart(){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerText = "❤️";
  h.style.left = Math.random()*100 + "%";
  h.style.fontSize = (15 + Math.random()*20) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
